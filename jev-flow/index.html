<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Flow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%233b5bdb%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.3.5/dist/style.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "@xyflow/react": "https://esm.sh/@xyflow/react@12.3.5?deps=react@18.3.1,react-dom@18.3.1",
    "@dagrejs/dagre": "https://esm.sh/@dagrejs/dagre@1.1.4",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #1c1b19; --ink2: #6b6860; --line: #e2dfd6; --accent: #3b5bdb; --accent-soft: #e5eafc;
    --good: #2b8a3e; --good-soft: #e3f4e6; --neutral: #495057; --neutral-soft: #eceef0; --warn: #b8640b; --warn-soft: #fdf0dc;
    --bad: #c92a2a; --bad-soft: #fde6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #f1efe9; --ink2: #a29f96; --line: #34332f; --accent: #8ea6ff; --accent-soft: #252c47;
      --good: #69db7c; --good-soft: #1d3322; --neutral: #ced4da; --neutral-soft: #2a2c2e; --warn: #ffc069; --warn-soft: #3a2c16;
      --bad: #ff8787; --bad-soft: #3d1f1f; }
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 70vh; } }
  aside { padding: 20px 16px; overflow-y: auto; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--ink2); margin: 0; }
  select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--card); color: var(--ink); font: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); margin-bottom: -6px; }
  .samples { display: grid; gap: 4px; }
  .sample { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink2); border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sample:hover { color: var(--ink); border-color: var(--ink2); }
  .row { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink2); padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .go { margin-left: auto; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: default; }
  .verdict { border-radius: 12px; padding: 12px 14px; } .verdict b { display: block; font-size: 18px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; }
  .stat div { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; } .stat span { color: var(--ink2); font-size: 11px; }
  .err { color: var(--bad); font-size: 13px; white-space: pre-wrap; }
  .tone-good { background: var(--good-soft); color: var(--good); } .tone-neutral { background: var(--neutral-soft); color: var(--neutral); }
  .tone-warn { background: var(--warn-soft); color: var(--warn); } .tone-bad { background: var(--bad-soft); color: var(--bad); }
  .canvas { position: relative; height: 100%; }
  .react-flow { --xy-background-color: var(--bg); }

  /* question node */
  .qnode { width: 240px; min-height: 96px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; transition: opacity .25s, box-shadow .25s; cursor: pointer; }
  .qnode.dim { opacity: .35; } .qnode.spare { opacity: .7; border-style: dashed; }
  .qnode.path { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
  .qnode.asking { border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .react-flow__node.selected .qnode, .react-flow__node.selected .onode { outline: 2px solid var(--ink2); outline-offset: 2px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }
  .qhead { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
  .step { background: var(--accent); color: #fff; border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .qid { font: 600 12px ui-monospace, monospace; }
  .qtype { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .qgate { margin-left: auto; font-size: 10.5px; color: var(--ink2); }
  .qtext { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .qans { margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--accent); }
  .qans.unsure { color: var(--warn); } .qans.asking { color: var(--ink2); font-weight: 500; }
  .qnode.spare .qans { color: var(--ink2); font-weight: 500; }

  /* outcome node */
  .onode { width: 150px; min-height: 40px; border-radius: 10px; padding: 6px 10px; display: grid; place-items: center; text-align: center; font-size: 12.5px; transition: opacity .25s, box-shadow .25s; cursor: pointer; }
  .onode.dim { opacity: .3; } .onode.hit { box-shadow: 0 0 0 2.5px currentColor; }

  /* edges */
  .react-flow__edge-path { stroke: var(--ink2); stroke-width: 1.2; }
  .react-flow__edge.taken .react-flow__edge-path { stroke: var(--accent); stroke-width: 2.6; }
  .react-flow__edge.dim { opacity: .18; }
  .react-flow__edge-text { font-size: 10.5px; fill: var(--ink2); }
  .react-flow__edge.taken .react-flow__edge-text { fill: var(--accent); font-weight: 700; }
  .react-flow__edge-textbg { fill: var(--bg); }

  /* detail panel */
  .detail { position: absolute; top: 12px; right: 12px; width: 320px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; z-index: 5; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  .detail h3 { margin: 0 0 4px; font: 600 14px ui-monospace, monospace; }
  .detail .x { float: right; border: 0; background: none; color: var(--ink2); font-size: 18px; cursor: pointer; }
  .opt { margin: 8px 0; } .opt b { font-size: 12.5px; } .opt p { margin: 1px 0 3px; color: var(--ink2); font-size: 12px; }
  .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
  .route { font: 11.5px ui-monospace, monospace; color: var(--ink2); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
