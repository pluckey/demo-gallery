<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%232b8a3e%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #1c1b19; --ink2: #6b6860; --line: #e2dfd6; --accent: #3b5bdb;
    --good: #2b8a3e; --good-soft: #e3f4e6; --warn: #b8640b; --warn-soft: #fdf0dc; --bad: #c92a2a; --bad-soft: #fde6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #f1efe9; --ink2: #a29f96; --line: #34332f; --accent: #8ea6ff;
      --good: #69db7c; --good-soft: #1d3322; --warn: #ffc069; --warn-soft: #3a2c16; --bad: #ff8787; --bad-soft: #3d1f1f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0; } .sub { color: var(--ink2); margin: 2px 0 16px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  select, input, textarea { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--card); color: var(--ink); font: inherit; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--ink2); }
  textarea { width: 100%; min-height: 260px; resize: vertical; line-height: 1.55; }
  .under { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
  .nudge { margin-top: 10px; border-radius: 10px; padding: 10px 12px; font-size: 14px; min-height: 44px; transition: background .3s; }
  .nudge b { font-weight: 600; }
  .nudge.next { background: var(--warn-soft); color: var(--warn); } .nudge.bad { background: var(--bad-soft); color: var(--bad); }
  .nudge.ok { background: var(--good-soft); color: var(--good); } .nudge.idle { color: var(--ink2); border: 1px dashed var(--line); }
  .meter { margin-bottom: 14px; }
  .meter .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); margin-bottom: 5px; }
  .meter .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .meter .fill { height: 100%; width: 0; background: var(--good); border-radius: 5px; transition: width .5s, background .5s; }
  .meter .what { font-size: 12.5px; color: var(--ink2); margin-top: 4px; min-height: 18px; }
  .warn { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
  li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 6px 4px; border-radius: 8px; align-items: start; }
  li .ic { width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
  li.done .ic, li.form .ic { background: var(--good); color: #fff; }
  li.missing .ic { background: var(--warn-soft); color: var(--warn); border: 1.5px solid var(--warn); }
  li.unsure .ic { border: 1.5px dashed var(--ink2); color: var(--ink2); }
  li.todo .ic { border: 1.5px solid var(--line); }
  li.todo .lb { color: var(--ink2); }
  li.hint .lb { font-size: 13px; font-style: italic; }
  .lead { font-size: 13px; color: var(--ink2); margin: 0 0 6px; }
  li .lb { font-size: 14px; } li.done .lb, li.form .lb { color: var(--ink2); }
  li .tip { font-size: 12.5px; color: var(--ink2); }
  li.isnext { background: var(--warn-soft); } li.isnext .tip { color: var(--warn); }
  li.just { animation: pop .6s ease-out; }
  li.follow { margin-left: 16px; }
  @keyframes pop { 0% { background: var(--good-soft); } 100% { background: transparent; } }
  .empty { color: var(--ink2); margin: 0; }
  .stats { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink2); display: flex; gap: 14px; flex-wrap: wrap; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Jev coach</h1>
  <p class="sub">Live feedback on an incident narrative while you write it. Jev checks the text against a rubric every time you pause.</p>
  <div class="bar">
    <select id="scenario"></select>
    <button class="primary" id="replay">Replay typing</button>
    <button id="clear">Clear</button>
  </div>
  <div class="grid">
    <section class="card">
      <h2>Incident report</h2>
      <div class="fields">
        <label>When <input type="datetime-local" id="date"></label>
        <label>Where <input id="location" placeholder="Site, building, area"></label>
      </div>
      <label for="narrative">What happened?</label>
      <textarea id="narrative" placeholder="Describe what happened, in your own words…"></textarea>
      <div class="nudge idle" id="nudge">Start writing. Suggestions show up here when you pause.</div>
      <div class="under"><span id="status"></span><span id="chars">0 characters</span></div>
    </section>
    <section class="card">
      <h2>Coach</h2>
      <div class="meter">
        <div class="top"><span>How usable is it?</span><span id="covered"></span></div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="what" id="what"></div>
      </div>
      <div id="warnings"></div>
      <div class="lead">A good report covers:</div>
      <div id="list"></div>
      <div class="stats" id="stats"></div>
    </section>
  </div>
</main>
<script type="module">
import { questions, evaluate, preview } from "./coach.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rubric = await (await fetch("./rubric.json")).json();
const follows = new Set(rubric.checks.filter((c) => c.showIf).map((c) => c.id));
const DEBOUNCE = 700;
let prev = null, seq = 0, timer = null, lastSent = "", replaying = 0;
const stats = { checks: 0, ms: 0, cost: 0 };

$("scenario").innerHTML = rubric.scenarios.map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join("");

// Ask after a pause, never more than one answer on screen per keystroke burst; late answers to old text are dropped.
const form = () => ({ date: $("date").value, location: $("location").value });
function schedule() { $("chars").textContent = `${$("narrative").value.length} characters`; clearTimeout(timer); timer = setTimeout(check, DEBOUNCE); }
["narrative", "date", "location"].forEach((id) => $(id).addEventListener("input", schedule));

async function check() {
  const text = $("narrative").value.trim(), f = form(), key = JSON.stringify([text, f]);
  if (key === lastSent) return;
  lastSent = key;
  if (text.length < rubric.minChars) { prev = null; return render(null); }  // too little to judge: show the target
  const mine = ++seq, t0 = performance.now();
  $("status").textContent = "Checking…";
  try {
    const r = await fetch("/decide", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: { [rubric.stateKey]: text }, questions: questions(rubric, f) }) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error ?? `error ${r.status}`);
    if (mine !== seq) return;  // the text changed while we waited
    const ms = Math.round(performance.now() - t0);
    Object.assign(stats, { checks: stats.checks + 1, ms: stats.ms + ms, cost: stats.cost + out.cost });
    const before = prev;
    prev = evaluate(rubric, out.answers, prev, f);
    render(prev, before);
    $("status").textContent = `Checked in ${ms} ms`;
  } catch (e) { if (mine === seq) $("status").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

function render(res, before = null) {
  if (!res) {
    res = preview(rubric, form());
    $("warnings").innerHTML = ""; $("fill").style.width = "0"; $("what").textContent = "";
    $("nudge").className = "nudge idle"; $("nudge").textContent = "Start writing. Suggestions show up here when you pause.";
  }
  const wasDone = new Set((before?.items ?? []).filter((i) => i.state === "done" || i.state === "form").map((i) => i.id));
  const covered = res.items.filter((i) => i.state === "done" || i.state === "form").length;
  $("covered").textContent = `${covered} of ${res.items.length} covered`;
  if (res.meter) {
    $("fill").style.width = `${Math.max(4, res.meter.score * 100)}%`;
    $("fill").style.background = res.meter.score >= 0.75 ? "var(--good)" : res.meter.score >= 0.4 ? "var(--warn)" : "var(--bad)";
    $("what").textContent = res.meter.label;
  }
  $("warnings").innerHTML = res.warnings.map((w) => `<div class="warn"><b>${esc(w.label)}:</b> ${esc(w.nudge)}</div>`).join("");
  const icon = { done: "✓", form: "✓", missing: "!", unsure: "?", todo: "" };
  $("list").innerHTML = `<ul>${res.items.map((i) => {
    const cls = [i.state, res.next.includes(i.id) ? "isnext" : "", (i.state === "done" || i.state === "form") && !wasDone.has(i.id) && before ? "just" : "", follows.has(i.id) ? "follow" : ""].join(" ");
    const tip = i.state === "form" ? "from the form" : i.state === "missing" ? i.nudge : i.state === "unsure" ? "maybe; could be clearer" : "";
    return `<li class="${cls}"><span class="ic">${icon[i.state]}</span><div><div class="lb">${esc(i.label)}</div>${tip ? `<div class="tip">${esc(tip)}</div>` : ""}</div></li>`;
  }).join("")}${res.hints.map((h) => `<li class="todo follow hint"><span class="ic"></span><div class="lb">${esc(h.text)}: ${h.labels.map(esc).join(" · ")}</div></li>`).join("")}</ul>`;
  if (res.items.every((i) => i.state === "todo" || i.state === "form") && !prev) return;  // the target only; nothing judged yet
  // The one suggestion next to the text box: a warning first, then the top missing item.
  const n = $("nudge"), firstMissing = res.items.find((i) => i.id === res.next[0]);
  if (res.warnings[0]) { n.className = "nudge bad"; n.innerHTML = `<b>Heads up:</b> ${esc(res.warnings[0].nudge)}`; }
  else if (firstMissing) { n.className = "nudge next"; n.innerHTML = `<b>Next:</b> ${esc(firstMissing.nudge)}`; }
  else if (res.items.every((i) => i.state === "done" || i.state === "form")) { n.className = "nudge ok"; n.innerHTML = "<b>Looks complete.</b> An adjuster could act on this."; }
  else { n.className = "nudge idle"; n.textContent = "Getting there. A few points could be clearer."; }
  $("stats").textContent = `${stats.checks} checks · ${Math.round(stats.ms / stats.checks)} ms average · $${stats.cost.toFixed(5)} this session`;
}

// Replay: type a scenario at human speed, pausing after each sentence long enough for the coach to answer.
async function replay() {
  const me = ++replaying, ta = $("narrative");
  const s = rubric.scenarios[$("scenario").value];
  ta.value = ""; $("date").value = ""; $("location").value = ""; prev = null; lastSent = ""; render(null); schedule();
  for (const step of s.steps) {
    if (typeof step === "string") {
      for (const ch of step) { if (me !== replaying) return; ta.value += ch; schedule(); await sleep(18); }
    } else if (step.remove) {
      const at = ta.value.lastIndexOf(step.remove);
      for (let k = step.remove.length; k > 0 && at >= 0; k--) {
        if (me !== replaying) return;
        ta.value = ta.value.slice(0, at + k - 1) + ta.value.slice(at + k); schedule(); await sleep(6);
      }
    }
    await sleep(2200);
  }
}
render(null);  // the target is visible before anyone types
$("replay").onclick = replay;
$("clear").onclick = () => { replaying++; $("narrative").value = ""; $("date").value = ""; $("location").value = ""; prev = null; lastSent = ""; render(null); schedule(); };
</script>
</body>
</html>
